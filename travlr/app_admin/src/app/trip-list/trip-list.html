<h2>Trips</h2>

<div *ngIf="loading">
  Loading trips...
</div>

<div *ngIf="errorMessage" class="alert alert-danger">
  {{ errorMessage }}
</div>

<div *ngIf="!loading && !errorMessage">

  <app-trip-card
    *ngFor="let trip of trips"
    [trip]="trip"
    (tripUpdated)="refreshTrips()"
    (tripDeleted)="refreshTrips()">
  </app-trip-card>

</div>
