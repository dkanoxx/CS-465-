<h2>Add Trip</h2>

<form (ngSubmit)="addTrip()" class="mb-4">

  <input class="form-control mb-2" name="code" [(ngModel)]="trip.code" placeholder="Code">
  <input class="form-control mb-2" name="name" [(ngModel)]="trip.name" placeholder="Name">
  <input class="form-control mb-2" name="length" [(ngModel)]="trip.length" placeholder="Length">
  <input class="form-control mb-2" name="start" [(ngModel)]="trip.start" placeholder="Start Date">
  <input class="form-control mb-2" name="resort" [(ngModel)]="trip.resort" placeholder="Resort">
  <input class="form-control mb-2" name="perPerson" [(ngModel)]="trip.perPerson" placeholder="Per Person">
  <input class="form-control mb-2" name="image" [(ngModel)]="trip.image" placeholder="Image">
  <textarea class="form-control mb-2" name="description" [(ngModel)]="trip.description" placeholder="Description"></textarea>

  <button class="btn btn-primary" type="submit">Add Trip</button>

</form>
